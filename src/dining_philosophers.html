<!DOCTYPE html>
<html lang="mn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dining Philosophers – Симулятор</title>
<style>
:root{--bg:#f3f1fa;--fg:#241f3a;--mut:#6b6785;--card:#ffffff;--bd:#dcd8ee;--think:#6c63d9;--hung:#f08a24;--eat:#1fa971;--bad:#d64545;--acc:#6c63d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#171428;--fg:#ece9fa;--mut:#a29fc0;--card:#221e38;--bd:#3a3560}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#171428;--fg:#ece9fa;--mut:#a29fc0;--card:#221e38;--bd:#3a3560}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px}
h1{font-size:19px;margin:0 auto 12px;max-width:1000px;padding:10px 14px;border-radius:12px;color:#fff;background:linear-gradient(120deg,#6c63d9,#1fa971)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;max-width:1000px;margin:auto}
@media(min-width:800px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(60,40,120,.10)}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}
input,select{width:90px;padding:3px 5px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:5px}
button{padding:6px 11px;border:1px solid var(--bd);border-radius:999px;background:var(--bg);color:var(--fg);cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}button:hover:not(:disabled){filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--bad);min-height:18px;font-size:13px}
.ban{display:none;background:var(--bad);color:#fff;padding:6px 10px;border-radius:6px;margin-top:6px}
.leg span{display:inline-block;margin-right:10px}.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:3px 6px;border-bottom:1px solid var(--bd);text-align:left}
#log{height:120px;overflow:auto;font:12px ui-monospace,monospace;color:var(--mut)}
svg{width:100%;max-width:380px;display:block;margin:auto}
</style></head><body>
<h1> Dining-Philosophers · Monitor / Deadlock</h1>
<div class="grid">
<div class="card">
<svg id="v" viewBox="0 0 360 360" role="img" aria-label="Philosophers table"></svg>
<div class="leg"><span><i style="background:var(--think)"></i>Thinking</span><span><i style="background:var(--hung)"></i>Hungry</span><span><i style="background:var(--eat)"></i>Eating</span><span>▬ Fork (эзэмшигчийн хажууд = эзэмшсэн)</span></div>
<div class="ban" id="dl">⚠ DEADLOCK: бүх philosopher зүүн fork-оо барьж, баруун fork-ийг хүлээж байна.</div>
<div id="clk" style="margin-top:6px;color:var(--mut)"></div>
</div>
<div class="card">
<label>Philosopher-ийн тоо (2–12)<input id="n" type="number" value="5"></label>
<label>Thinking min / max (мс)<span><input id="t0" type="number" value="1000" style="width:70px"> <input id="t1" type="number" value="3000" style="width:70px"></span></label>
<label>Eating min / max (мс)<span><input id="e0" type="number" value="1000" style="width:70px"> <input id="e1" type="number" value="2000" style="width:70px"></span></label>
<label>Seed<input id="seed" type="number" value="42"></label>
<label>Хурд (×)<select id="spd"><option>0.5</option><option selected>1</option><option>2</option><option>5</option><option>10</option></select></label>
<label>Алгоритм<select id="mode" style="width:170px"><option value="mon">Monitor (deadlock-гүй)</option><option value="naive">Naive: зүүн→баруун (deadlock)</option></select></label>
<div class="err" id="err"></div>
<button class="p" id="go">Start / Apply</button> <button id="pz">Pause</button> <button id="st">Step 100мс</button> <button id="rs">Reset</button>
</div>
<div class="card sc"><table id="tb"></table></div>
<div class="card"><b>Event log</b><div id="log"></div></div>
</div>
<script>
const $=id=>document.getElementById(id),C={thinking:'var(--think)',hungry:'var(--hung)',eating:'var(--eat)'};
let S=null,timer=null,paused=false;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function params(){
  const g=id=>Number($(id).value),n=g('n'),p={n,t0:g('t0'),t1:g('t1'),e0:g('e0'),e1:g('e1'),seed:g('seed'),mode:$('mode').value,spd:Number($('spd').value)};
  if(!Number.isInteger(n)||n<2||n>12)return[null,'Philosopher-ийн тоо 2…12 бүхэл тоо байх ёстой.'];
  for(const k of['t0','t1','e0','e1'])if(!Number.isFinite(p[k])||p[k]<=0)return[null,'Хугацаа 0-ээс их тоо байх ёстой ('+k+').'];
  if(p.t0>p.t1||p.e0>p.e1)return[null,'min нь max-аас их байж болохгүй.'];
  if(!Number.isFinite(p.seed))return[null,'Seed тоо байх ёстой.'];
  return[p,''];
}
function init(p){
  const r=rng(p.seed);
  S={p,r,t:0,dead:false,fork:Array(p.n).fill(-1),
   ph:Array.from({length:p.n},()=>({st:'thinking',left:false,right:false,rem:0,meals:0,since:0,maxWait:0,hold:0}))};
  S.ph.forEach((q,i)=>q.rem=rnd(p.t0,p.t1));
  $('dl').style.display='none';log('Эхлэв: N='+p.n+', mode='+p.mode+', seed='+p.seed);
}
function rnd(a,b){return Math.round(a+S.r()*(b-a))}
function log(m){const d=$('log');d.insertAdjacentHTML('beforeend','<div>['+(S?S.t:0)+'мс] '+m+'</div>');d.scrollTop=1e9}
function setEat(i){const q=S.ph[i];q.st='eating';q.left=q.right=true;S.fork[i]=i;S.fork[(i+1)%S.p.n]=i;q.rem=rnd(S.p.e0,S.p.e1);q.maxWait=Math.max(q.maxWait,S.t-q.since);log('P'+i+' eating (fork '+i+','+(i+1)%S.p.n+')')}
function test(i){const n=S.p.n,q=S.ph[i];if(q.st==='hungry'&&S.ph[(i+n-1)%n].st!=='eating'&&S.ph[(i+1)%n].st!=='eating')setEat(i)}
function tick(dt){
  if(!S||S.dead)return;const n=S.p.n,naive=S.p.mode==='naive';S.t+=dt;
  for(let i=0;i<n;i++){const q=S.ph[i];
    if(q.st==='thinking'||q.st==='eating')q.rem-=dt;
    if(q.st==='thinking'&&q.rem<=0){q.st='hungry';q.since=S.t;log('P'+i+' hungry');if(!naive)test(i)}
    else if(q.st==='eating'&&q.rem<=0){q.st='thinking';q.left=q.right=false;S.fork[i]=-1;S.fork[(i+1)%n]=-1;q.meals++;q.rem=rnd(S.p.t0,S.p.t1);log('P'+i+' thinking (fork-ууд суллагдав)');
      if(!naive){test((i+n-1)%n);test((i+1)%n)}}
    if(naive&&q.st==='hungry'){
      if(!q.left&&S.fork[i]<0){S.fork[i]=i;q.left=true;q.hold=500;log('P'+i+' зүүн fork '+i+' авав')}
      else if(q.left&&!q.right){q.hold-=dt;const r=(i+1)%n;if(q.hold<=0&&S.fork[r]<0){S.fork[r]=i;q.right=true;setEat(i)}}}
  }
  if(naive&&S.ph.every(q=>q.st==='hungry'&&q.left&&!q.right)){S.dead=true;$('dl').style.display='block';log('DEADLOCK илэрлээ')}
}
function draw(){
  const n=S.p.n,o=180,R=125,th=i=>-Math.PI/2+2*Math.PI*i/n;let s=`<circle cx="${o}" cy="${o}" r="85" fill="var(--bg)" stroke="var(--bd)" stroke-width="3"/>`;
  for(let k=0;k<n;k++){const own=S.fork[k],a=own<0?th(k)+Math.PI/n:th(own)+(k===own?-0.22:0.22),r=own<0?62:(78),col=own<0?'var(--mut)':C[S.ph[own].st],
    x1=o+(r-12)*Math.cos(a),y1=o+(r-12)*Math.sin(a),x2=o+(r+12)*Math.cos(a),y2=o+(r+12)*Math.sin(a);
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="5" stroke-linecap="round"/><text x="${o+(r-24)*Math.cos(a)}" y="${o+(r-24)*Math.sin(a)+3}" font-size="9" text-anchor="middle" fill="var(--mut)">f${k}</text>`}
  const pr=n>8?18:22;
  S.ph.forEach((q,i)=>{const x=o+R*Math.cos(th(i)),y=o+R*Math.sin(th(i));s+=`<circle cx="${x}" cy="${y}" r="${pr}" fill="${C[q.st]}" stroke="var(--card)" stroke-width="3"/><text x="${x}" y="${y+4}" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">P${i}</text>`});
  $('v').innerHTML=s;$('clk').textContent='Simulated time: '+(S.t/1000).toFixed(1)+' с';
  let h='<tr><th>P</th><th>Төлөв</th><th>Fork (зүүн/баруун)</th><th>Хоол</th><th>Хүлээсэн</th></tr>';
  S.ph.forEach((q,i)=>{const w=q.st==='hungry'?S.t-q.since:q.maxWait;h+=`<tr><td>P${i}</td><td style="color:${C[q.st]}">${q.st}</td><td>${q.left?'f'+i:'–'} / ${q.right?'f'+(i+1)%S.p.n:'–'}</td><td>${q.meals}</td><td>${(w/1000).toFixed(1)}с${q.st==='hungry'?' …':' (max)'}</td></tr>`});
  $('tb').innerHTML=h;
}
function loop(){clearInterval(timer);timer=setInterval(()=>{if(!paused){tick(50*S.p.spd);draw()}},50)}
$('go').onclick=()=>{const[p,e]=params();$('err').textContent=e;if(e)return;$('log').innerHTML='';init(p);paused=false;$('pz').textContent='Pause';draw();loop()};
$('pz').onclick=()=>{if(!S)return;paused=!paused;$('pz').textContent=paused?'Resume':'Pause'};
$('st').onclick=()=>{if(!S){$('go').click()}paused=true;$('pz').textContent='Resume';tick(100);draw()};
$('rs').onclick=()=>{clearInterval(timer);S=null;$('log').innerHTML='';$('v').innerHTML='';$('tb').innerHTML='';$('dl').style.display='none';$('err').textContent='';$('clk').textContent='Reset хийгдлээ.'};
$('go').click();
</script></body></html>
